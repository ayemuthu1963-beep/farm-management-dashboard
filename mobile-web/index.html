<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#eaf6df" />
    <title>Muthu Farms</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #eaf6df; color: #073d19; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; }
      main { width: min(88vw, 28rem); text-align: center; }
      img { width: 11rem; height: 11rem; object-fit: contain; }
      h1 { margin: 1rem 0 0.35rem; letter-spacing: 0.12em; }
      p { margin: 0; line-height: 1.5; color: #315c3e; }
    </style>
  </head>
  <body>
    <main>
      <img src="muthu-farms-logo.png" alt="Muthu Farms" />
      <h1>MUTHU FARMS</h1>
      <p>Connecting securely to the Muthu Farms Preview service.</p>
    </main>
  </body>
</html>
