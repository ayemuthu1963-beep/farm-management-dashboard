name: Preview baseline validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activate pnpm 10.34.5
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run TypeScript validation
        run: pnpm typecheck

      - name: Build production frontend
        run: pnpm build
