name: Preview baseline validation

on:
  pull_request:
    branches:
      - main
      - production-release
      - preview-release
      - test-release
  push:
    branches:
      - main
      - production-release
      - preview-release
      - test-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Activate pnpm 10.34.5
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run TypeScript validation
        run: pnpm typecheck

      - name: Build production frontend
        run: pnpm build
