name: Roll back Preview frontend

on:
  workflow_dispatch:
    inputs:
      current_revision:
        description: Exact 40-character revision currently running on Preview
        required: true
        type: string
      confirmation:
        description: Type ROLL BACK PREVIEW to authorize the guarded rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mfms-preview-server
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require exact Preview-only inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CURRENT_REVISION: ${{ inputs.current_revision }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || {
            echo "Preview rollback must be dispatched from main" >&2
            exit 1
          }
          [[ "$CONFIRMATION" == "ROLL BACK PREVIEW" ]] || {
            echo "Confirmation did not match ROLL BACK PREVIEW" >&2
            exit 1
          }
          [[ "$CURRENT_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Current revision is not an exact lowercase commit SHA" >&2
            exit 1
          }

  rollback:
    needs: authorize
    environment:
      name: Preview
      url: https://preview.muthufarms.com/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate and install the dedicated Preview deploy identity
        id: ssh
        shell: bash
        env:
          PREVIEW_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_PRIVATE_KEY }}
          PREVIEW_SSH_HOST: ${{ vars.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER }}
        run: |
          set -euo pipefail

          for required_name in \
            PREVIEW_DEPLOY_SSH_PRIVATE_KEY \
            PREVIEW_SSH_HOST \
            PREVIEW_SSH_KNOWN_HOSTS \
            PREVIEW_SSH_USER
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required Preview environment setting: $required_name" >&2
              exit 1
            fi
          done

          [[ "$PREVIEW_SSH_HOST" == "168.144.179.221" ]] || {
            echo "The configured host is not the approved Preview server" >&2
            exit 1
          }
          [[ "$PREVIEW_SSH_USER" == "muthu" ]] || {
            echo "The configured user is not the approved Preview account" >&2
            exit 1
          }

          ssh_dir="$RUNNER_TEMP/mfms-preview-deploy-ssh"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          install -m 600 /dev/null "$ssh_dir/known_hosts"
          printf '%s\n' "$PREVIEW_DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null
          ssh-keygen -F "$PREVIEW_SSH_HOST" -f "$ssh_dir/known_hosts" >/dev/null

          echo "identity_file=$ssh_dir/id_ed25519" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Restore the immediately previous Preview frontend
        shell: bash
        env:
          CURRENT_REVISION: ${{ inputs.current_revision }}
          IDENTITY_FILE: ${{ steps.ssh.outputs.identity_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          PREVIEW_SSH_HOST: ${{ vars.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/preview-server-rollback.txt"
          : > "$report"

          ssh -T \
            -i "$IDENTITY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o KbdInteractiveAuthentication=no \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=10 \
            "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" \
            "rollback-preview $CURRENT_REVISION $GITHUB_RUN_ID" \
            | tee "$report"

          grep -Fqx 'rollback_environment=Preview' "$report"
          grep -Fqx 'rollback_url=https://preview.muthufarms.com' "$report"
          grep -Fqx 'backend_unchanged=true' "$report"
          grep -Fqx 'database_unchanged=true' "$report"
          grep -Fqx 'odk_unchanged=true' "$report"
          grep -Fqx 'schedules_unchanged=true' "$report"
          grep -Fqx 'proxy_configuration_unchanged=true' "$report"
          grep -Fqx 'production_touched=0' "$report"
          grep -Fqx 'PREVIEW_ROLLBACK=PASS' "$report"

      - name: Upload sanitized Preview rollback report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: preview-server-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-server-rollback.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mfms-preview-deploy-ssh"
