name: Deploy Production frontend

on:
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: Exact 40-character farm-management-dashboard production-release revision to deploy
        required: true
        type: string
      expected_current_revision:
        description: Exact 40-character revision currently running in Production
        required: true
        type: string
      confirmation:
        description: Type DEPLOY PRODUCTION FRONTEND ONLY to authorize the guarded frontend switch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mfms-production-server
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_revision: ${{ steps.release.outputs.candidate_revision }}
      expected_current_revision: ${{ steps.release.outputs.expected_current_revision }}
    steps:
      - name: Require an exact Production frontend request
        id: release
        shell: bash
        env:
          CANDIDATE_INPUT: ${{ inputs.candidate_revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CURRENT_INPUT: ${{ inputs.expected_current_revision }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]]
          [[ "$CONFIRMATION" == "DEPLOY PRODUCTION FRONTEND ONLY" ]]
          [[ "$CANDIDATE_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_INPUT" != "$CURRENT_INPUT" ]]
          echo "candidate_revision=$CANDIDATE_INPUT" >> "$GITHUB_OUTPUT"
          echo "expected_current_revision=$CURRENT_INPUT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    environment:
      name: Production
      url: https://muthufarms.com/
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Install the dedicated Production frontend deploy identity
        id: ssh
        shell: bash
        env:
          PRODUCTION_FRONTEND_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_FRONTEND_DEPLOY_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          for required_name in \
            PRODUCTION_FRONTEND_DEPLOY_SSH_PRIVATE_KEY \
            PRODUCTION_SSH_HOST \
            PRODUCTION_SSH_KNOWN_HOSTS \
            PRODUCTION_SSH_USER
          do
            [[ -n "${!required_name:-}" ]]
          done
          [[ "$PRODUCTION_SSH_HOST" == "168.144.179.221" ]]
          [[ "$PRODUCTION_SSH_USER" == "muthu" ]]
          ssh_dir="$RUNNER_TEMP/mfms-production-frontend-deploy-ssh"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          install -m 600 /dev/null "$ssh_dir/known_hosts"
          printf '%s\n' "$PRODUCTION_FRONTEND_DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null
          ssh-keygen -F "$PRODUCTION_SSH_HOST" -f "$ssh_dir/known_hosts" >/dev/null
          echo "identity_file=$ssh_dir/id_ed25519" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Deploy the approved Production frontend revision
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ needs.authorize.outputs.candidate_revision }}
          EXPECTED_CURRENT_REVISION: ${{ needs.authorize.outputs.expected_current_revision }}
          IDENTITY_FILE: ${{ steps.ssh.outputs.identity_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/production-frontend-deployment.txt"
          : > "$report"
          ssh -T \
            -i "$IDENTITY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o KbdInteractiveAuthentication=no \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=10 \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "deploy-production-frontend $CANDIDATE_REVISION $EXPECTED_CURRENT_REVISION $GITHUB_RUN_ID" \
            | tee "$report"
          grep -Fqx 'deployment_environment=Production' "$report"
          grep -Fqx 'deployment_url=https://muthufarms.com' "$report"
          grep -Fqx "previous_revision=$EXPECTED_CURRENT_REVISION" "$report"
          grep -Fqx "deployed_revision=$CANDIDATE_REVISION" "$report"
          grep -Eq '^deployed_image_id=sha256:[0-9a-f]{64}$' "$report"
          grep -Eq '^preview_approved_revision=[0-9a-f]{40}$' "$report"
          grep -Eq '^preview_approved_image_id=sha256:[0-9a-f]{64}$' "$report"
          grep -Eq '^preview_feature_revision=[0-9a-f]{40}$' "$report"
          grep -Eq '^preview_verified_file_count=[1-9][0-9]*$' "$report"
          grep -Fqx 'production_source_matches_preview=true' "$report"
          grep -Eq '^rollback_container=mfms-v0-preview-web-pre-github-[0-9]+-[0-9]{8}T[0-9]{6}Z$' "$report"
          grep -Fqx 'backend_unchanged=true' "$report"
          grep -Fqx 'database_unchanged=true' "$report"
          grep -Fqx 'odk_unchanged=true' "$report"
          grep -Fqx 'schedules_unchanged=true' "$report"
          grep -Fqx 'proxy_configuration_unchanged=true' "$report"
          grep -Fqx 'preview_touched=0' "$report"
          grep -Fqx 'test_touched=0' "$report"
          grep -Fqx 'production_frontend_touched=1' "$report"
          grep -Fqx 'PRODUCTION_DEPLOYMENT=PASS' "$report"

      - name: Upload sanitized Production frontend deployment report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-frontend-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/production-frontend-deployment.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mfms-production-frontend-deploy-ssh"
