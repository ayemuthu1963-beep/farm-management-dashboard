name: Mobile iOS Preview

on:
  workflow_dispatch:
    inputs:
      build_ad_hoc:
        description: Build a Preview Ad Hoc IPA for registered Muthu Farms devices
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - "ios/**"
      - "assets/**"
      - "mobile-web/**"
      - "scripts/fix-capacitor-ios-spm.mjs"
      - "tests/mobile-app-config.mjs"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

env:
  MOBILE_WEB_URL: https://preview.muthufarms.com

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:verify
      - run: pnpm mobile:ios:sync
      - name: Compile for iOS Simulator without signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MuthuFarmsDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

  ad-hoc-ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ad_hoc
    needs: simulator-build
    runs-on: macos-26
    timeout-minutes: 45
    environment: mobile-ios-ad-hoc
    env:
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_AD_HOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:verify
      - run: pnpm mobile:ios:sync
      - name: Install ephemeral signing material
        shell: bash
        run: |
          set -euo pipefail
          required=(
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD
            IOS_AD_HOC_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID
          )
          for variable in "${required[@]}"; do
            test -n "${!variable:-}" || { echo "Required protected secret is missing: $variable" >&2; exit 2; }
          done
          certificate="$RUNNER_TEMP/muthu-farms-distribution.p12"
          profile="$RUNNER_TEMP/muthu-farms-ad-hoc.mobileprovision"
          profile_plist="$RUNNER_TEMP/muthu-farms-ad-hoc.plist"
          keychain="$RUNNER_TEMP/muthu-farms-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_AD_HOC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$profile_plist"

          profile_uuid="$(plutil -extract UUID raw "$profile_plist")"
          profile_name="$(plutil -extract Name raw "$profile_plist")"
          profile_team="$(plutil -extract TeamIdentifier.0 raw "$profile_plist")"
          profile_application_id="$(plutil -extract Entitlements.application-identifier raw "$profile_plist")"
          profile_device_count="$(plutil -extract ProvisionedDevices json -o - "$profile_plist" | jq 'length')"
          test "$profile_team" = "$APPLE_TEAM_ID" || { echo 'Ad Hoc profile Team ID mismatch.' >&2; exit 3; }
          [[ "$profile_application_id" == *.com.muthufarms.app ]] || {
            echo 'Ad Hoc profile does not authorize com.muthufarms.app.' >&2
            exit 3
          }
          test "$profile_device_count" -gt 0 || { echo 'Ad Hoc profile contains no registered devices.' >&2; exit 3; }

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf 'IOS_AD_HOC_PROFILE_NAME=%s\n' "$profile_name" >> "$GITHUB_ENV"
          printf 'IOS_AD_HOC_PROFILE_UUID=%s\n' "$profile_uuid" >> "$GITHUB_ENV"
          echo "Validated Ad Hoc profile for $profile_device_count registered device(s)."
      - name: Archive Preview application
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/MuthuFarms.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          PROVISIONING_PROFILE_SPECIFIER="$IOS_AD_HOC_PROFILE_NAME"
          archive
      - name: Export registered-device IPA
        shell: bash
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          if xcodebuild -help 2>&1 | grep -q 'release-testing'; then
            export_method='release-testing'
          else
            export_method='ad-hoc'
          fi
          plutil -create xml1 "$options"
          plutil -insert method -string "$export_method" "$options"
          plutil -insert destination -string export "$options"
          plutil -insert signingStyle -string manual "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert provisioningProfiles -json "{\"com.muthufarms.app\":\"$IOS_AD_HOC_PROFILE_NAME\"}" "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MuthuFarms.xcarchive" \
            -exportPath "$RUNNER_TEMP/MuthuFarmsExport" \
            -exportOptionsPlist "$options"
      - name: Verify Ad Hoc IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/MuthuFarmsExport" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa" || { echo 'Ad Hoc IPA was not produced.' >&2; exit 4; }
          inspect="$RUNNER_TEMP/MuthuFarmsIpaInspect"
          mkdir -p "$inspect"
          unzip -q "$ipa" -d "$inspect"
          app="$(find "$inspect/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = 'com.muthufarms.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          embedded="$app/embedded.mobileprovision"
          test -f "$embedded"
          embedded_plist="$RUNNER_TEMP/embedded-ad-hoc.plist"
          security cms -D -i "$embedded" > "$embedded_plist"
          test "$(plutil -extract UUID raw "$embedded_plist")" = "$IOS_AD_HOC_PROFILE_UUID"
          plutil -extract ProvisionedDevices json -o - "$embedded_plist" | jq -e 'length > 0' >/dev/null
          shasum -a 256 "$ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: muthu-farms-ios-preview-ad-hoc
          path: ${{ runner.temp }}/MuthuFarmsExport/*.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/muthu-farms-signing.keychain-db" 2>/dev/null || true
          if [[ -n "${IOS_AD_HOC_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_AD_HOC_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/muthu-farms-distribution.p12" \
            "$RUNNER_TEMP/muthu-farms-ad-hoc.mobileprovision" \
            "$RUNNER_TEMP/muthu-farms-ad-hoc.plist"
