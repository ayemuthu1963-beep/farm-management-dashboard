name: Deploy Preview backend

on:
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: Exact 40-character muthu-harvest-dashboard preview-release revision to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY PREVIEW BACKEND ONLY to authorize the guarded API switch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mfms-preview-server
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_revision: ${{ steps.release.outputs.candidate_revision }}
    steps:
      - name: Require the exact Preview-only backend release request
        id: release
        shell: bash
        env:
          CANDIDATE_INPUT: ${{ inputs.candidate_revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || {
            echo "Preview backend deployment must execute from trusted main" >&2
            exit 1
          }
          [[ "$CONFIRMATION" == "DEPLOY PREVIEW BACKEND ONLY" ]] || {
            echo "Confirmation did not match DEPLOY PREVIEW BACKEND ONLY" >&2
            exit 1
          }
          [[ "$CANDIDATE_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Backend candidate revision is not an exact lowercase commit SHA" >&2
            exit 1
          }

          echo "candidate_revision=$CANDIDATE_INPUT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    environment:
      name: Preview
      url: https://preview.muthufarms.com/
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate and install the dedicated Preview backend deploy identity
        id: ssh
        shell: bash
        env:
          PREVIEW_BACKEND_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_BACKEND_DEPLOY_SSH_PRIVATE_KEY }}
          PREVIEW_SSH_HOST: ${{ vars.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER }}
        run: |
          set -euo pipefail

          for required_name in \
            PREVIEW_BACKEND_DEPLOY_SSH_PRIVATE_KEY \
            PREVIEW_SSH_HOST \
            PREVIEW_SSH_KNOWN_HOSTS \
            PREVIEW_SSH_USER
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required Preview environment setting: $required_name" >&2
              exit 1
            fi
          done

          [[ "$PREVIEW_SSH_HOST" == "168.144.179.221" ]] || {
            echo "The configured host is not the approved Preview server" >&2
            exit 1
          }
          [[ "$PREVIEW_SSH_USER" == "muthu" ]] || {
            echo "The configured user is not the approved Preview account" >&2
            exit 1
          }

          ssh_dir="$RUNNER_TEMP/mfms-preview-backend-deploy-ssh"
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          install -m 600 /dev/null "$ssh_dir/known_hosts"
          printf '%s\n' "$PREVIEW_BACKEND_DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null
          ssh-keygen -F "$PREVIEW_SSH_HOST" -f "$ssh_dir/known_hosts" >/dev/null

          echo "identity_file=$ssh_dir/id_ed25519" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Deploy the approved Preview backend revision
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ needs.authorize.outputs.candidate_revision }}
          IDENTITY_FILE: ${{ steps.ssh.outputs.identity_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          PREVIEW_SSH_HOST: ${{ vars.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_USER: ${{ vars.PREVIEW_SSH_USER }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/preview-backend-deployment.txt"
          : > "$report"

          ssh -T \
            -i "$IDENTITY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o KbdInteractiveAuthentication=no \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=10 \
            "$PREVIEW_SSH_USER@$PREVIEW_SSH_HOST" \
            "deploy-preview-backend $CANDIDATE_REVISION $GITHUB_RUN_ID" \
            | tee "$report"

          grep -Fqx 'deployment_environment=Preview' "$report"
          grep -Fqx 'deployment_component=backend' "$report"
          grep -Fqx 'deployment_url=https://preview.muthufarms.com' "$report"
          grep -Fqx "deployed_backend_revision=$CANDIDATE_REVISION" "$report"
          grep -Fqx 'database=mfms_server_uat' "$report"
          grep -Eq '^database_backup_path=/home/muthu/\.local/state/mfms-preview-github/database-backups/mfms_server_uat-pre-[0-9a-f]{40}-[0-9]{8}T[0-9]{6}Z\.dump$' "$report"
          grep -Eq '^database_backup_sha256=[0-9a-f]{64}$' "$report"
          grep -Eq '^database_backup_bytes=[1-9][0-9]*$' "$report"
          grep -Fqx 'database_backup_verified=true' "$report"
          grep -Fqx 'database_migrations=forward-only' "$report"
          grep -Fqx 'worker_actor_assertion=server-local' "$report"
          grep -Fqx 'frontend_unchanged=true' "$report"
          grep -Fqx 'odk_unchanged=true' "$report"
          grep -Fqx 'schedules_unchanged=true' "$report"
          grep -Fqx 'proxy_configuration_unchanged=true' "$report"
          grep -Fqx 'production_touched=0' "$report"
          grep -Fqx 'PREVIEW_BACKEND_DEPLOYMENT=PASS' "$report"

      - name: Upload sanitized Preview backend deployment report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: preview-backend-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-backend-deployment.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mfms-preview-backend-deploy-ssh"
